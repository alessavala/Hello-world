client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "referral-rewards"
handle = "referral-rewards"
application_url = "https://REPLACE_WITH_YOUR_APP_URL"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_customers,read_discounts,write_discounts,read_orders,read_products"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_APP_URL/auth/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/auth/shopify/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/api/auth/callback"
]

[webhooks]
api_version = "2024-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders/paid"

[app_proxy]
url = "https://REPLACE_WITH_YOUR_APP_URL/proxy"
subpath = "referrals"
prefix = "apps"

[pos]
embedded = false
