services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
      POSTGRES_DB: creator_commerce
    ports:
      - "5432:5432"
    volumes:
      - creator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  creator_postgres:
